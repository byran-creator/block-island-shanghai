name: Validate Pages release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-validation
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:release
      - run: npm run build:pages
      - name: Archive validated Pages output
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages/
